name: Finans Ajanı Günlük Rapor

on:
  schedule:
      # Saatler UTC (Dünya Saati) üzerindendir.
      # Türkiye saati için 3 saat çıkarmalısın.
      - cron: "0 7,15 * * *"
      - cron: "30 18 * * *"
  workflow_dispatch: # Bu satır manuel çalıştırmanı sağlar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          pip install -r requirements.txt

      - name: Ajanı Çalıştır
        run: python main.py
